[package]
name = "shipper"
version = "0.1.0"
edition = "2024"

[lib]
name = "shipper"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
regex = "1"
csv = "1.4.0"
pyo3 = { version = "0.27.0", features = ["extension-module", "experimental-inspect"] }
pythonize = { version = "0.27.0" }
